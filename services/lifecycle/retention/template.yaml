# D3: scheduled retention purge job (Lambda + EventBridge).
#
# Mirrors services/ingestion/s3-extraction/template.yaml's shape (esbuild
# BuildMethod bundling src/handler.ts plus its relative imports into
# ../../../../lib/*.ts, Node 20 runtime) with the trigger swapped from S3
# ObjectCreated to an EventBridge Schedule. Final deploy verification is
# D4's job (AWS deployment, demo assembly) -- this defines the stack, it
# hasn't been `sam deploy`'d.

AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Scheduled job that purges S3 raw documents past org retention_years and marks the corresponding documents rows purged.

Parameters:
  DatabaseUrl:
    Type: String
    NoEcho: true
  IngestionBucketName:
    Type: String
    Description: Name of the S3 bucket holding raw documents (services/ingestion/s3-extraction's IngestionBucket).
  ScheduleExpression:
    Type: String
    Default: rate(1 day)

Resources:
  RetentionPurgeFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: node20
        EntryPoints:
          - src/handler.ts
    Properties:
      CodeUri: .
      Handler: handler.handler
      Runtime: nodejs20.x
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          COCKROACH_DATABASE_URL: !Ref DatabaseUrl
          INGESTION_BUCKET: !Ref IngestionBucketName
      Events:
        DailyRetentionSweep:
          Type: Schedule
          Properties:
            Schedule: !Ref ScheduleExpression
            Enabled: true
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref IngestionBucketName

  RetentionPurgeErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-retention-purge-errors"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref RetentionPurgeFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold

Outputs:
  RetentionPurgeFunctionName:
    Value: !Ref RetentionPurgeFunction
